<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AnimeKEL // Code Nexus</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&family=Fira+Code:wght@400;600&display=swap" rel="stylesheet">
    <!-- استخدام أحدث إصدار مستقر من سوبابيس لتجنب مشاكل الاتصال -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-deep: #05050a;
            --bg-card: rgba(13, 15, 33, 0.85);
            --neon-cyan: #00f3ff;
            --neon-pink: #ff0055;
            --neon-purple: #9d00ff;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --border-glow: rgba(0, 243, 255, 0.3);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: var(--bg-deep);
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(157, 0, 255, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(0, 243, 255, 0.1) 0%, transparent 40%);
            color: var(--text-main);
            min-height: 100vh;
            padding-bottom: 40px;
        }

        .container {
            max-width: 650px;
            margin: 0 auto;
            padding: 20px;
        }

        .app-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 25px 0;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .app-header h1 {
            font-size: 22px;
            background: linear-gradient(45deg, var(--neon-cyan), #ffffff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .nav-tabs {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
        }

        .tab-btn {
            flex: 1;
            padding: 12px;
            background: var(--bg-card);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-muted);
            border-radius: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
        }

        .tab-btn.active {
            background: rgba(0, 243, 255, 0.1);
            border-color: var(--neon-cyan);
            color: var(--neon-cyan);
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.2);
        }

        .post-card {
            background: var(--bg-card);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
            backdrop-filter: blur(10px);
        }

        .post-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 15px;
        }

        .author-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .author-info img {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--neon-pink);
            box-shadow: 0 0 10px rgba(255, 0, 85, 0.4);
        }

        .author-name {
            font-weight: 700;
            font-size: 16px;
            color: #fff;
        }

        .post-date {
            font-size: 11px;
            color: var(--text-muted);
        }

        .lang-badge {
            background: rgba(0, 243, 255, 0.1);
            color: var(--neon-cyan);
            border: 1px solid rgba(0, 243, 255, 0.3);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        .input-group {
            position: relative;
            margin-bottom: 20px;
            text-align: right;
        }

        .input-group label {
            display: block;
            font-size: 13px;
            color: var(--neon-cyan);
            margin-bottom: 8px;
            font-weight: 600;
        }

        input[type="text"], select, textarea {
            width: 100%;
            padding: 14px 16px;
            background: rgba(5, 5, 10, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
            border-radius: 12px;
            font-size: 15px;
            outline: none;
            transition: all 0.3s;
        }

        input[type="text"]:focus, select:focus, textarea:focus {
            border-color: var(--neon-cyan);
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.4);
        }

        .neon-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--neon-cyan), var(--neon-purple));
            color: #05050a;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.4);
            text-transform: uppercase;
        }

        .neon-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 30px rgba(0, 243, 255, 0.8);
        }

        .code-box-wrapper {
            position: relative;
            margin: 15px 0;
        }

        pre {
            background: #020408;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            padding: 15px;
            overflow-x: auto;
            direction: ltr;
            text-align: left;
            max-height: 250px;
        }

        code {
            font-family: 'Fira Code', monospace;
            font-size: 13px;
            color: #38bdf8;
        }

        .copy-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #e2e8f0;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: 0.2s;
        }

        .copy-btn:hover {
            background: var(--neon-cyan);
            color: #05050a;
            border-color: var(--neon-cyan);
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div class="container">
        <div class="app-header">
            <h1>AnimeKEL // Code Nexus</h1>
            <span style="font-size: 12px; color: var(--neon-cyan); background: rgba(0,243,255,0.1); padding: 5px 12px; border-radius: 20px; border: 1px solid rgba(0,243,255,0.3);">متصل بالسيرفر ⚡</span>
        </div>

        <div class="nav-tabs">
            <button id="tab-home" onclick="switchTab('home')" class="tab-btn active">الرئيسية (المنشورات)</button>
            <button id="tab-add" onclick="switchTab('add')" class="tab-btn">+ نشر كود جديد</button>
        </div>

        <div id="section-home">
            <div id="posts-container"></div>
        </div>

        <div id="section-add" class="hidden">
            <div class="post-card">
                <h3 style="margin-bottom: 15px; color: var(--neon-cyan);">مشاركة شفرة برمجية جديدة</h3>
                <div class="input-group">
                    <label>اسمك أو لقبك البرمجي</label>
                    <input type="text" id="post-author" placeholder="اكتب اسمك هنا...">
                </div>
                <div class="input-group">
                    <label>لغة البرمجة</label>
                    <select id="post-lang">
                        <option value="Python">Python</option>
                        <option value="HTML">HTML / CSS</option>
                        <option value="JavaScript">JavaScript</option>
                        <option value="C++">C++</option>
                        <option value="Other">أخرى</option>
                    </select>
                </div>
                <div class="input-group">
                    <label>الكود البرمجي</label>
                    <textarea id="post-code" rows="10" placeholder="// الصق كودك هنا بكل حرية..."></textarea>
                </div>
                <button class="neon-btn" id="publish-btn" onclick="publishPost()">نشر الآن 🚀</button>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://kuugumwfczbeaoqzwxjh.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_XPhRmT5SaYRLl9b0oByzWw_FXw64hs6';
        
        // تهيئة سوبابيس بالإصدار الثاني الحديث
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let globalPosts = [];

        window.onload = function() {
            loadPosts();
        };

        function switchTab(tab) {
            if (tab === 'home') {
                document.getElementById('section-home').classList.remove('hidden');
                document.getElementById('section-add').classList.add('hidden');
                document.getElementById('tab-home').classList.add('active');
                document.getElementById('tab-add').classList.remove('active');
                loadPosts();
            } else {
                document.getElementById('section-home').classList.add('hidden');
                document.getElementById('section-add').classList.remove('hidden');
                document.getElementById('tab-add').classList.add('active');
                document.getElementById('tab-home').classList.remove('active');
            }
        }

        async function publishPost() {
            const authorInput = document.getElementById('post-author').value.trim();
            const author = authorInput !== "" ? authorInput : "مبرمج مجهول";
            const lang = document.getElementById('post-lang').value;
            const code = document.getElementById('post-code').value;
            const btn = document.getElementById('publish-btn');

            if (!code.trim()) {
                alert("لا يمكن نشر كود فارغ!");
                return;
            }

            btn.innerText = "جاري الإرسال للسيرفر...";
            btn.disabled = true;

            const avatar = `https://api.dicebear.com/7.x/bottts/svg?seed=${encodeURIComponent(author)}`;

            try {
                const { data, error } = await supabaseClient
                    .from('posts')
                    .insert([
                        { 
                            author: author, 
                            avatar: avatar, 
                            language: lang, 
                            code: code 
                        }
                    ]);

                if (error) {
                    console.error("Supabase Error:", error);
                    alert("خطأ من السيرفر: " + error.message);
                    btn.innerText = "نشر الآن 🚀";
                    btn.disabled = false;
                    return;
                }

                document.getElementById('post-code').value = '';
                document.getElementById('post-author').value = '';
                btn.innerText = "نشر الآن 🚀";
                btn.disabled = false;
                
                // الانتقال للرئيسية وعرض المنشورات فوراً
                switchTab('home');
            } catch (err) {
                console.error("Network Error:", err);
                alert("فشل الاتصال بالخادم، تحقق من الانترنت أو صلاحيات الجدول.");
                btn.innerText = "نشر الآن 🚀";
                btn.disabled = false;
            }
        }

        async function loadPosts() {
            const container = document.getElementById('posts-container');
            container.innerHTML = `<p style="text-align: center; color: var(--text-muted); padding: 20px;">جاري جلب الأكواد من السيرفر...</p>`;

            try {
                const { data: posts, error } = await supabaseClient
                    .from('posts')
                    .select('*')
                    .order('created_at', { ascending: false });

                if (error) {
                    container.innerHTML = `<p style="text-align: center; color: var(--neon-pink); padding: 20px;">خطأ في التحميل: ${error.message}</p>`;
                    return;
                }

                globalPosts = posts || [];

                if (globalPosts.length === 0) {
                    container.innerHTML = `
                        <div style="text-align: center; padding: 40px; color: var(--text-muted);">
                            <p style="font-size: 16px;">لا توجد منشورات برمجية حالياً.</p>
                            <p style="font-size: 13px; margin-top: 5px;">انتقل إلى تبويب "+ نشر كود جديد" وكن أول من يشارك شيفرة!</p>
                        </div>
                    `;
                    return;
                }

                container.innerHTML = '';
                globalPosts.forEach((p, index) => {
                    const formattedDate = p.created_at ? new Date(p.created_at).toLocaleString('ar-EG', { hour: '2-digit', minute: '2-digit' }) : '';
                    container.innerHTML += `
                        <div class="post-card">
                            <div class="post-header">
                                <div class="author-info">
                                    <img src="${p.avatar}" alt="user">
                                    <div>
                                        <div class="author-name">${escapeHtml(p.author)}</div>
                                        <div class="post-date">${formattedDate}</div>
                                    </div>
                                </div>
                                <span class="lang-badge">${p.language}</span>
                            </div>
                            <div class="code-box-wrapper">
                                <pre><code>${escapeHtml(p.code)}</code></pre>
                            </div>
                            <button class="copy-btn" onclick="copyCode(${index})">📋 نسخ الكود</button>
                        </div>
                    `;
                });
            } catch (err) {
                container.innerHTML = `<p style="text-align: center; color: var(--neon-pink); padding: 20px;">تعذر الاتصال بقاعدة البيانات.</p>`;
            }
        }

        function copyCode(index) {
            navigator.clipboard.writeText(globalPosts[index].code).then(() => {
                alert("✨ تم نسخ الكود بنجاح إلى الحافظة!");
            });
        }

        function escapeHtml(text) {
            if (!text) return '';
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
    </script>
</body>
</html>
