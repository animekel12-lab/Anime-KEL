<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة صانع وتثبيت تطبيقات النيون</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #08070b;
            --surface-color: #121019;
            --surface-hover: #1c1826;
            --primary-color: #8b5cf6;
            --primary-hover: #7c3aed;
            --accent-glow: rgba(139, 92, 246, 0.25);
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --border-color: #262138;
            --nav-height: 70px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            padding-bottom: calc(var(--nav-height) + 25px);
        }

        header {
            background: rgba(18, 16, 25, 0.85);
            backdrop-filter: blur(12px);
            padding: 16px 20px;
            text-align: center;
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        header h1 {
            font-size: 1.25rem;
            font-weight: 700;
            color: #c4b5fd;
            text-shadow: 0 0 15px rgba(139, 92, 246, 0.4);
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }

        .view-section {
            display: none;
            animation: fadeIn 0.3s ease-in-out;
        }

        .view-section.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .card-form {
            background-color: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 18px;
            padding: 22px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label.title-label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.9rem;
            color: var(--text-muted);
            font-weight: 600;
        }

        .form-control {
            width: 100%;
            padding: 12px 16px;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            color: var(--text-main);
            font-size: 0.95rem;
            outline: none;
            transition: all 0.3s;
        }

        .form-control:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        textarea.form-control {
            resize: vertical;
            min-height: 160px;
            font-family: monospace;
            direction: ltr;
            text-align: left;
        }

        .mode-switcher {
            display: flex;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 4px;
            margin-bottom: 15px;
        }

        .mode-btn {
            flex: 1;
            background: none;
            border: none;
            padding: 10px;
            color: var(--text-muted);
            font-size: 0.85rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .mode-btn.active {
            background: var(--primary-color);
            color: white;
            box-shadow: 0 0 10px rgba(139, 92, 246, 0.4);
        }

        .input-mode-content {
            display: none;
        }

        .input-mode-content.active {
            display: block;
        }

        .upload-btn-wrapper {
            position: relative;
            overflow: hidden;
            display: block;
            width: 100%;
        }

        .file-upload-box {
            border: 2px dashed var(--border-color);
            background-color: var(--bg-color);
            padding: 16px;
            border-radius: 12px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            color: var(--text-muted);
            font-size: 0.9rem;
            font-weight: 600;
            width: 100%;
        }

        .file-upload-box:hover {
            border-color: var(--primary-color);
            color: var(--primary-color);
            background-color: rgba(139, 92, 246, 0.03);
        }

        .upload-btn-wrapper input[type="file"] {
            position: absolute;
            left: 0;
            top: 0;
            opacity: 0;
            width: 100%;
            height: 100%;
            cursor: pointer;
        }

        .file-status {
            font-size: 0.8rem;
            color: #34d399;
            margin-top: 6px;
            display: block;
        }

        .btn-primary {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--primary-color), var(--primary-hover));
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.1s, box-shadow 0.3s;
            box-shadow: 0 4px 15px rgba(139, 92, 246, 0.35);
        }

        .btn-primary:active {
            transform: scale(0.98);
        }

        .apps-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 16px;
        }

        .app-card {
            background-color: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 16px;
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .app-icon {
            width: 64px;
            height: 64px;
            border-radius: 14px;
            object-fit: cover;
            background-color: var(--surface-hover);
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            color: var(--primary-color);
            border: 1px solid var(--border-color);
        }

        .app-info {
            flex-grow: 1;
            min-width: 0;
        }

        .app-name {
            font-size: 1.05rem;
            font-weight: 700;
            margin-bottom: 8px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: #f8fafc;
        }

        .app-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .btn-action {
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 0.8rem;
            font-weight: 600;
            border: none;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            text-decoration: none;
        }

        .btn-run {
            background-color: rgba(139, 92, 246, 0.15);
            color: #c4b5fd;
            border: 1px solid rgba(139, 92, 246, 0.3);
        }

        .btn-download {
            background-color: rgba(16, 185, 129, 0.12);
            color: #34d399;
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        .btn-delete {
            background-color: rgba(239, 68, 68, 0.12);
            color: #f87171;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        .empty-state {
            text-align: center;
            padding: 50px 20px;
            color: var(--text-muted);
        }

        .empty-state i {
            font-size: 3.5rem;
            margin-bottom: 15px;
            color: var(--border-color);
        }

        nav.bottom-nav {
            position: fixed;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            width: calc(100% - 30px);
            max-width: 450px;
            height: var(--nav-height);
            background: rgba(18, 16, 25, 0.92);
            backdrop-filter: blur(15px);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.7);
            z-index: 1000;
        }

        .nav-item {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 0.85rem;
            font-weight: 600;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            width: 50%;
        }

        .nav-item.active {
            color: #c4b5fd;
            text-shadow: 0 0 10px rgba(139, 92, 246, 0.5);
        }

        #preview-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-color);
            z-index: 2000;
            display: none;
            flex-direction: column;
        }

        .modal-header {
            padding: 12px 20px;
            background-color: var(--surface-color);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-title {
            font-weight: 700;
            font-size: 1rem;
            color: #c4b5fd;
        }

        .btn-close {
            background: none;
            border: none;
            color: var(--text-main);
            font-size: 1.25rem;
            cursor: pointer;
            padding: 5px;
        }

        #preview-frame {
            flex-grow: 1;
            width: 100%;
            border: none;
            background: white;
        }
    </style>
</head>
<body>

    <header>
        <h1><i class="fa-solid fa-code-merge"></i> منصة صانع وتثبيت تطبيقات النيون</h1>
    </header>

    <div class="container">
        <!-- قسم العرض والتثبيت -->
        <section id="view-section" class="view-section active">
            <div id="apps-container" class="apps-grid"></div>
        </section>

        <!-- قسم الصنع -->
        <section id="create-section" class="view-section">
            <div class="card-form">
                <form id="app-form" onsubmit="saveApp(event)">
                    <div class="form-group">
                        <label class="title-label" for="appName">اسم التطبيق</label>
                        <input type="text" id="appName" class="form-control" placeholder="مثال: لعبتي الذكية" required>
                    </div>

                    <div class="form-group">
                        <label class="title-label">صورة أيقونة التطبيق (من المعرض)</label>
                        <div class="upload-btn-wrapper">
                            <div class="file-upload-box">
                                <i class="fa-solid fa-image"></i>
                                <span id="icon-file-label">اختر صورة من الاستوديو</span>
                            </div>
                            <input type="file" id="appIconFile" accept="image/*" onchange="handleIconUpload(event)" required>
                        </div>
                        <span id="icon-status" class="file-status" style="display:none;">تم اختيار الصورة بنجاح ✓</span>
                    </div>

                    <div class="form-group">
                        <label class="title-label">مصدر كود التطبيق</label>
                        <div class="mode-switcher">
                            <button type="button" class="mode-btn active" id="btn-mode-file" onclick="setHtmlInputMode('file')">
                                <i class="fa-solid fa-file-arrow-up"></i> رفع ملف index.html
                            </button>
                            <button type="button" class="mode-btn" id="btn-mode-code" onclick="setHtmlInputMode('code')">
                                <i class="fa-solid fa-keyboard"></i> كتابة / لصق الكود
                            </button>
                        </div>

                        <div id="mode-file-content" class="input-mode-content active">
                            <div class="upload-btn-wrapper">
                                <div class="file-upload-box">
                                    <i class="fa-solid fa-file-code"></i>
                                    <span id="html-file-label">اختر ملف index.html من ملفاتك</span>
                                </div>
                                <input type="file" id="appHtmlFile" accept=".html,.htm" onchange="handleHtmlUpload(event)">
                            </div>
                            <span id="html-status" class="file-status" style="display:none;">تم تحميل كود الملف بنجاح ✓</span>
                        </div>

                        <div id="mode-code-content" class="input-mode-content">
                            <textarea id="appHtmlCodeText" class="form-control" placeholder="<!DOCTYPE html>&#10;<html>&#10;<head><style>/* CSS هنا */</style></head>&#10;<body>&#10;  <!-- HTML & JS هنا -->&#10;</body>&#10;</html>"></textarea>
                        </div>
                    </div>

                    <button type="submit" class="btn-primary">
                        <i class="fa-solid fa-wand-magic-sparkles"></i> إنشاء وتثبيت التطبيق
                    </button>
                </form>
            </div>
        </section>
    </div>

    <!-- نافذة المعاينة -->
    <div id="preview-modal">
        <div class="modal-header">
            <span class="modal-title" id="modal-app-name">معاينة التطبيق</span>
            <button class="btn-close" onclick="closePreview()"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <iframe id="preview-frame"></iframe>
    </div>

    <!-- القائمة السفلية -->
    <nav class="bottom-nav">
        <button class="nav-item active" onclick="switchTab('view', this)">
            <i class="fa-solid fa-layer-group"></i>
            <span>العرض والتثبيت</span>
        </button>
        <button class="nav-item" onclick="switchTab('create', this)">
            <i class="fa-solid fa-plus-circle"></i>
            <span>الصنع</span>
        </button>
    </nav>

    <script>
        let selectedIconBase64 = '';
        let uploadedHtmlCode = '';
        let currentInputMode = 'file';

        function switchTab(tabName, btnElement) {
            document.querySelectorAll('.view-section').forEach(sec => sec.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(btn => btn.classList.remove('active'));

            if (tabName === 'view') {
                document.getElementById('view-section').classList.add('active');
                loadApps();
            } else {
                document.getElementById('create-section').classList.add('active');
            }
            btnElement.classList.add('active');
        }

        function setHtmlInputMode(mode) {
            currentInputMode = mode;
            const btnFile = document.getElementById('btn-mode-file');
            const btnCode = document.getElementById('btn-mode-code');
            const contentFile = document.getElementById('mode-file-content');
            const contentCode = document.getElementById('mode-code-content');

            if (mode === 'file') {
                btnFile.classList.add('active');
                btnCode.classList.remove('active');
                contentFile.classList.add('active');
                contentCode.classList.remove('active');
            } else {
                btnCode.classList.add('active');
                btnFile.classList.remove('active');
                contentCode.classList.add('active');
                contentFile.classList.remove('active');
            }
        }

        function handleIconUpload(event) {
            const file = event.target.files[0];
            if (!file) return;
            document.getElementById('icon-file-label').innerText = file.name;
            document.getElementById('icon-status').style.display = 'block';

            const reader = new FileReader();
            reader.onload = function(e) { selectedIconBase64 = e.target.result; };
            reader.readAsDataURL(file);
        }

        function handleHtmlUpload(event) {
            const file = event.target.files[0];
            if (!file) return;
            document.getElementById('html-file-label').innerText = file.name;
            document.getElementById('html-status').style.display = 'block';

            const reader = new FileReader();
            reader.onload = function(e) { uploadedHtmlCode = e.target.result; };
            reader.readAsText(file);
        }

        function getApps() {
            return JSON.parse(localStorage.getItem('neon_html_apps')) || [];
        }

        function saveApp(event) {
            event.preventDefault();
            const name = document.getElementById('appName').value.trim();

            if (!selectedIconBase64) {
                alert('يرجى اختيار صورة الأيقونة أولاً!');
                return;
            }

            let finalCode = '';
            if (currentInputMode === 'file') {
                if (!uploadedHtmlCode) {
                    alert('يرجى اختيار ملف index.html أو التبديل لوضع كتابة الكود!');
                    return;
                }
                finalCode = uploadedHtmlCode;
            } else {
                finalCode = document.getElementById('appHtmlCodeText').value;
                if (!finalCode.trim()) {
                    alert('يرجى كتابة أو لصق الكود في الصندوق!');
                    return;
                }
            }

            const newApp = {
                id: Date.now(),
                name,
                icon: selectedIconBase64,
                code: finalCode
            };

            const apps = getApps();
            apps.push(newApp);
            localStorage.setItem('neon_html_apps', JSON.stringify(apps));

            document.getElementById('app-form').reset();
            selectedIconBase64 = '';
            uploadedHtmlCode = '';
            document.getElementById('icon-file-label').innerText = 'اختر صورة من الاستوديو';
            document.getElementById('icon-status').style.display = 'none';
            document.getElementById('html-file-label').innerText = 'اختر ملف index.html من ملفاتك';
            document.getElementById('html-status').style.display = 'none';
            setHtmlInputMode('file');

            switchTab('view', document.querySelectorAll('.nav-item')[0]);
        }

        function loadApps() {
            const apps = getApps();
            const container = document.getElementById('apps-container');

            if (apps.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="fa-solid fa-box-open"></i>
                        <p>لا توجد تطبيقات صنعتها بعد!</p>
                        <p style="font-size: 0.8rem; margin-top: 5px; color: var(--text-muted);">انتقل إلى قسم "الصنع" لإنشاء أول تطبيق لك.</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = '';
            apps.forEach(app => {
                const card = document.createElement('div');
                card.className = 'app-card';
                card.innerHTML = `
                    <img src="${app.icon}" class="app-icon" alt="Icon">
                    <div class="app-info">
                        <div class="app-name">${escapeHtml(app.name)}</div>
                        <div class="app-actions">
                            <button class="btn-action btn-run" onclick="runApp(${app.id})">
                                <i class="fa-solid fa-play"></i> تشغيل
                            </button>
                            <button class="btn-action btn-download" onclick="downloadApp(${app.id})">
                                <i class="fa-solid fa-download"></i> تثبيت/حفظ
                            </button>
                            <button class="btn-action btn-delete" onclick="deleteApp(${app.id})">
                                <i class="fa-solid fa-trash"></i>
                            </button>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function runApp(id) {
            const apps = getApps();
            const app = apps.find(a => a.id === id);
            if (!app) return;
            document.getElementById('modal-app-name').innerText = app.name;
            const iframe = document.getElementById('preview-frame');
            iframe.srcdoc = app.code;
            document.getElementById('preview-modal').style.display = 'flex';
        }

        function closePreview() {
            document.getElementById('preview-modal').style.display = 'none';
            document.getElementById('preview-frame').srcdoc = '';
        }

        // تم تعيين اسم الملف ليطابق اسم التطبيق الحقيقي تماماً
        function downloadApp(id) {
            const apps = getApps();
            const app = apps.find(a => a.id === id);
            if (!app) return;

            const blob = new Blob([app.code], { type: 'text/html;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            // تنظيف اسم الملف من الرموز والمسافات غير المسموحة
            const safeName = app.name.replace(/[/\\?%*:|"<>]/g, '').trim() || 'app';
            a.download = `${safeName}.html`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            setTimeout(() => URL.revokeObjectURL(url), 1000);
        }

        function deleteApp(id) {
            if (confirm('هل أنت متأكد من حذف هذا التطبيق؟')) {
                let apps = getApps();
                apps = apps.filter(a => a.id !== id);
                localStorage.setItem('neon_html_apps', JSON.stringify(apps));
                loadApps();
            }
        }

        function escapeHtml(text) {
            const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
            return text.replace(/[&<>"']/g, function(m) { return map[m]; });
        }

        window.onload = loadApps;
    </script>
</body>
</html>
